[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011"]

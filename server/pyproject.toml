[project]
name = "biounlock-server"
version = "0.2.1"
description = "Self-hosted backend for the BioUnlock remote-unlock agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "cryptography>=42,<46",
    "webauthn>=2.3,<3.0",
    "bcrypt>=4.1,<5.0",
    "psycopg[binary]>=3.1,<4.0",
    "email-validator>=2.1,<3.0",
    "python-dotenv>=1.0,<2.0",
]

# This is an application, not an installable package: uv resolves dependencies
# only and must not try to build/install the project itself.
[tool.uv]
package = false

# Vercel's FastAPI preset serves this ASGI app on every route, so no /api
# function or catch-all rewrite is needed.
[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011"]
